# ==========================================================
#  Локальная разработка
#  Применяется автоматически при `docker compose up -d`
# ==========================================================

services:
  nginx:
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx/local.conf:/etc/nginx/conf.d/default.conf

  mysql:
    ports:
      - "${FORWARD_DB_PORT:-3306}:3306"

  redis:
    ports:
      - "${FORWARD_REDIS_PORT:-6379}:6379"
