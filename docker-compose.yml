# ==========================================================
#  story_api — базовый compose
#  Локально:  docker compose up -d
#             (автоматически подхватит docker-compose.override.yml)
#  Сервер:    docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
# ==========================================================
name: story_api

services:
    nginx:
        image: nginx:alpine
        container_name: story_nginx
        volumes:
            - ./:/var/www/html
        depends_on:
            - php
        networks:
            - story_net

    php:
        build:
            context: .
            dockerfile: Dockerfile
        container_name: story_php
        working_dir: /var/www/html
        volumes:
            - ./:/var/www/html
        extra_hosts:
            - "host.docker.internal:host-gateway"
        depends_on:
            - mysql
            - redis
        networks:
            - story_net
        user: "1000:1000"

    mysql:
        image: mysql:8.4
        container_name: story_mysql
        environment:
            MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
            MYSQL_DATABASE: ${DB_DATABASE}
            MYSQL_USER: ${DB_USERNAME}
            MYSQL_PASSWORD: ${DB_PASSWORD}
        volumes:
            - story_mysql_data:/var/lib/mysql
        networks:
            - story_net

    redis:
        image: redis:alpine
        container_name: story_redis
        networks:
            - story_net

networks:
    story_net:
        driver: bridge

volumes:
    story_mysql_data:
