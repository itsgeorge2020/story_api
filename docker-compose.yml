# ==========================================================
#  story_api — самодостаточный стек
#  Запуск:  cd projects/story_api && docker compose up -d
#  Все данные БД берутся из .env этого же проекта.
# ==========================================================
name: story_api

services:
  nginx:
    image: nginx:alpine
    container_name: story_nginx
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - ./:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - php
    networks:
      - story_net

  php:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: story_php
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - mysql
      - redis
    networks:
      - story_net
    user: "1000:1000"

  mysql:
    image: mysql:8.4
    container_name: story_mysql
    ports:
      - "${FORWARD_DB_PORT:-3306}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - story_mysql_data:/var/lib/mysql
    networks:
      - story_net

  redis:
    image: redis:alpine
    container_name: story_redis
    ports:
      - "${FORWARD_REDIS_PORT:-6379}:6379"
    networks:
      - story_net

networks:
  story_net:
    driver: bridge

volumes:
  story_mysql_data:
